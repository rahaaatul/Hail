syntax = "proto3";

package com.aistra.hail.backup;

option java_package = "com.aistra.hail.backup";
option java_multiple_files = true;
option java_outer_classname = "SettingsBackupProto";

// User settings backed up/restored via the Hail backup archive.
// Fields are optional so presence can be distinguished from default values,
// enabling safe schema evolution (add/remove fields without breaking old backups).
message SettingsBackup {
  // String settings
  optional string sort_by = 1;
  optional string working_mode = 2;
  optional string app_theme = 3;
  optional string icon_pack = 4;
  optional string tile_action = 5;
  optional string dynamic_shortcut_action = 6;

  // Boolean settings
  optional bool filter_user_apps = 7;
  optional bool filter_system_apps = 8;
  optional bool filter_enabled_apps = 9;
  optional bool filter_disabled_apps = 10;
  optional bool filter_suspended_apps = 11;
  optional bool filter_hidden_apps = 12;
  optional bool filter_stopped_apps = 13;
  optional bool biometric_login = 14;
  optional bool grayscale_icon = 15;
  optional bool compact_icon = 16;
  optional bool synthesize_adaptive_icons = 17;
  optional bool fuzzy_search = 18;
  optional bool nine_key_search = 19;
  optional bool auto_freeze_after_lock = 20;
  optional bool skip_while_charging = 21;
  optional bool skip_foreground_app = 22;
  optional bool skip_notifying_app = 23;

  // Float settings
  optional float home_font_size = 24;
  optional float auto_freeze_delay = 25;
}
