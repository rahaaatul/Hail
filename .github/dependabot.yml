version: 2
# Group dependencies to reduce pull request noise
groups:
  # npm development dependencies
  npm-dev-deps:
    patterns:
      - "*"
    dependency-type: "development"
    update-types:
      - "minor"
      - "patch"
  # Gradle dependencies (all)
  gradle-deps:
    patterns:
      - "*"
    update-types:
      - "minor"
      - "patch"
  # GitHub Actions
  github-actions:
    patterns:
      - "*"
    update-types:
      - "minor"
      - "patch"

updates:
  # npm dependencies in the root directory
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - npm-dev-deps
    ignore:
      - dependency-name: "semantic-release"
        versions: ["22.x"]  # Pin to specific version if needed, or remove to allow updates
      - dependency-name: "@semantic-release/git"
        versions: ["10.x"]  # Example of pinning
    allow:
      - dependency-type: "development"  # Only update devDependencies for npm

  # npm dependencies in the morphe-patches directory
  - package-ecosystem: "npm"
    directory: "/morphe-patches"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "npm"
      - "morphe-patches"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - npm-dev-deps
    ignore:
      - dependency-name: "semantic-release"
        versions: ["25.x"]
    allow:
      - dependency-type: "development"

  # Gradle dependencies in the root directory
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - gradle-deps
    # For Gradle, we might want to ignore certain versions or dependencies
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        versions: ["8.x"]  # Example if we want to pin AGP version

  # Gradle dependencies in the morphe-patches directory
  - package-ecosystem: "gradle"
    directory: "/morphe-patches"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "gradle"
      - "morphe-patches"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - gradle-deps

  # GitHub Actions in the root directory
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "10:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - github-actions
    # GitHub Actions dependencies are the actions used in workflows
    ignore:
      - dependency-name: "actions/checkout"
        versions: ["v4"]  # Example if we want to stay on v3
      - dependency-name: "actions/setup-node"
        versions: ["v4"]  # Example if we want to stay on v3

  # GitHub Actions in the morphe-patches directory
  - package-ecosystem: "github-actions"
    directory: "/morphe-patches"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "github-actions"
      - "morphe-patches"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      - github-actions