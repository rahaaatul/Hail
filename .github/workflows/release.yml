name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildType: [release, debug]
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: ./gradlew test
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        with:
          buildType: ${{ matrix.buildType }}
      - name: Rename APK
        uses: .github/actions/rename-apk
        with:
          buildType: ${{ matrix.buildType }}
          version: ${{ steps.metadata.outputs.version }}
          appName: ${{ steps.metadata.outputs.appName }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.buildType }}-apk
          path: app/build/outputs/apk/${{ matrix.buildType }}/${{ steps.metadata.outputs.appName }}-${{ steps.metadata.outputs.version }}-${{ matrix.buildType }}.apk
      - name: Release
        if: matrix.buildType == 'release'  # Only run semantic-release once, e.g., on the release matrix
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
