name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildType: [release, debug]
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: 21
          distribution: temurin
          gradle-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        id: build
        with:
          buildType: ${{ matrix.buildType }}
      - name: Rename APK
        uses: .github/actions/rename-apk
        id: rename
        with:
          apkPath: ${{ steps.build.outputs.apkPath }}
          version: ${{ steps.metadata.outputs.version }}
          appName: ${{ steps.metadata.outputs.appName }}
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.rename.outputs.renamedApkPath }}
          asset_name: ${{ steps.rename.outputs.renamedApkPath }}
          asset_content_type: application/vnd.android.package-archive