name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildType: [release, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: .github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build both APKs (with metadata, tests, and Detekt)
        uses: .github/actions/build-apk
        id: build
      - name: Generate attestation for release APK
        id: attest-release
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.releaseApkPath }}
          push-to-registry: false
      - name: Generate attestation for debug APK
        id: attest-debug
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.debugApkPath }}
          push-to-registry: false
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       - name: Upload APKs and attestations to Release
         uses: actions/upload-release-asset@v1
         with:
           upload_url: ${{ steps.release_step.outputs.upload_url }}
           asset_path: ${{ matrix.buildType == 'release' && steps.build.outputs.releaseApkPath || steps.build.outputs.debugApkPath }}
           asset_name: ${{ matrix.buildType == 'release' && steps.build.outputs.releaseApkPath || steps.build.outputs.debugApkPath }}
           asset_content_type: application/vnd.android.package-archive
      - name: Upload release attestation to Release
        if: steps.attest-release.outputs.attestation-path != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.attest-release.outputs.attestation-path }}
          asset_name: ${{ steps.attest-release.outputs.attestation-path }}
          asset_content_type: application/vnd.in-toto+json
      - name: Upload debug attestation to Release
        if: steps.attest-debug.outputs.attestation-path != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.attest-debug.outputs.attestation-path }}
          asset_name: ${{ steps.attest-debug.outputs.attestation-path }}
          asset_content_type: application/vnd.in-toto+json