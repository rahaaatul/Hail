name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build and rename APKs
        id: build_matrix
        run: |
          # Build and rename both release and debug APKs
          # Unit testing and Detekt code quality checks are now handled by the build-apk action
          echo "Building release APK..."
          ./gradlew assembleRelease --no-daemon
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          RELEASE_RENAMED="${{ steps.metadata.outputs.appName }}-${{ steps.metadata.outputs.version }}-release.apk"
          mv "$RELEASE_APK" "$RELEASE_RENAMED"
          echo "release_apk_path=$RELEASE_RENAMED" >> $GITHUB_OUTPUT
          
          echo "Building debug APK..."
          ./gradlew assembleDebug --no-daemon
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          DEBUG_RENAMED="${{ steps.metadata.outputs.appName }}-${{ steps.metadata.outputs.version }}-debug.apk"
          mv "$DEBUG_APK" "$DEBUG_RENAMED"
          echo "debug_apk_path=$DEBUG_RENAMED" >> $GITHUB_OUTPUT
        shell: bash
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.build_matrix.outputs.release_apk_path }}
          asset_name: ${{ steps.build_matrix.outputs.release_apk_path }}
          asset_content_type: application/vnd.android.package-archive
      - name: Upload Debug APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.build_matrix.outputs.debug_apk_path }}
          asset_name: ${{ steps.build_matrix.outputs.debug_apk_path }}
          asset_content_type: application/vnd.android.package-archive