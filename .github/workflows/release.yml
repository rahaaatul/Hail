name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: .github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find built APKs
        if: steps.release_step.outputs.new_release_published == 'true'
        id: build
        run: |
          set -euo pipefail
          release_apk=$(find app/build/outputs/apk -name '*-release.apk' -print -quit)
          debug_apk=$(find app/build/outputs/apk -name '*-debug.apk' -print -quit)
          test -n "$release_apk"
          test -n "$debug_apk"
          echo "releaseApkPath=$release_apk" >> "$GITHUB_OUTPUT"
          echo "debugApkPath=$debug_apk" >> "$GITHUB_OUTPUT"
      - name: Generate attestation for release APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-release
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.releaseApkPath }}
          push-to-registry: false
      - name: Generate attestation for debug APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-debug
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.debugApkPath }}
          push-to-registry: false
      - name: Upload APK attestations to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_step.outputs.new_release_git_tag }}
          RELEASE_ATTESTATION: ${{ steps.attest-release.outputs.attestation-path }}
          DEBUG_ATTESTATION: ${{ steps.attest-debug.outputs.attestation-path }}
        run: |
          set -euo pipefail
          for attestation in "$RELEASE_ATTESTATION" "$DEBUG_ATTESTATION"; do
            if [[ -n "$attestation" ]]; then
              gh release upload "$RELEASE_TAG" "$attestation" --clobber
            fi
          done
