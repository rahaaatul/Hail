name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - '.releaserc'
      - '.github/workflows/release.yml'
      - '.github/actions/build-apk/**'
      - '.github/actions/setup-java-gradle/**'
      - '.github/actions/commitlint/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: none
    runs-on: ubuntu-latest
    environment: production
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52522783374182d1188df
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@9e4326c6d7268d7da5a395069a201cb833a02ca5
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build APKs (with metadata, tests, and Detekt)
        if: steps.release_step.outputs.new_release_published == 'true'
        id: build
        uses: ./.github/actions/build-apk
        with:
          versionCodeOverride: ${{ steps.release_step.outputs.new_release_version_code }}
      - name: Generate attestation for release APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-release
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: ${{ steps.build.outputs.releaseApkPath }}
          push-to-registry: false
      - name: Generate attestation for debug APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-debug
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: ${{ steps.build.outputs.debugApkPath }}
          push-to-registry: false
      - name: Upload release APK to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        id: upload-release-apk
        uses: actions/upload-release-asset@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.build.outputs.releaseApkPath }}
          asset_content_type: application/vnd.android.package-archive
      - name: Upload debug APK to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        id: upload-debug-apk
        uses: actions/upload-release-asset@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ steps.build.outputs.debugApkPath }}
          asset_content_type: application/vnd.android.package-archive
      - name: Upload APK attestations to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        uses: ./.github/actions/upload-release-attestations
        with:
          release-tag: ${{ steps.release_step.outputs.new_release_git_tag }}
          release-bundle: ${{ steps.attest-release.outputs.bundle-path }}
          debug-bundle: ${{ steps.attest-debug.outputs.bundle-path }}
