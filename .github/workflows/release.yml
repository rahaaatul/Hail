name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - '.releaserc'
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find built APKs
        if: steps.release_step.outputs.new_release_published == 'true'
        id: build
        uses: ./.github/actions/find-release-apks
      - name: Generate attestation for release APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-release
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.releaseApkPath }}
          push-to-registry: false
      - name: Generate attestation for debug APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-debug
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.build.outputs.debugApkPath }}
          push-to-registry: false
      - name: Upload APK attestations to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        uses: ./.github/actions/upload-release-attestations
        with:
          release-tag: ${{ steps.release_step.outputs.new_release_git_tag }}
          release-bundle: ${{ steps.attest-release.outputs.bundle-path }}
          debug-bundle: ${{ steps.attest-debug.outputs.bundle-path }}
