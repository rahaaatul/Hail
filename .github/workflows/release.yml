name: Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'package-lock.json'
      - 'app/src/main/AndroidManifest.xml'
      - '.releaserc'
      - '.github/workflows/release.yml'
      - '.github/actions/build-apk/**'
      - '.github/actions/setup-java-gradle/**'
      - '.github/actions/commitlint/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: none
    runs-on: ubuntu-latest
    environment: production
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore release branch state
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git checkout -f -B "$BRANCH" "origin/$BRANCH"
        shell: bash
      - name: Build APKs (with metadata, tests, and Detekt)
        if: steps.release_step.outputs.new_release_published == 'true'
        id: build
        uses: ./.github/actions/build-apk
      - name: Generate attestation for release APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.build.outputs.releaseApkPath }}
          push-to-registry: false
      - name: Generate attestation for debug APK
        if: steps.release_step.outputs.new_release_published == 'true'
        id: attest-debug
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.build.outputs.debugApkPath }}
          push-to-registry: false
      - name: Upload APKs to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_step.outputs.new_release_git_tag }}
          RELEASE_APK: ${{ steps.build.outputs.releaseApkPath }}
          DEBUG_APK: ${{ steps.build.outputs.debugApkPath }}
        run: |
          set -euo pipefail
          for apk in "$RELEASE_APK" "$DEBUG_APK"; do
            if [ ! -f "$apk" ]; then
              echo "APK not found: $apk" >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" "$RELEASE_APK" "$DEBUG_APK" --clobber
        shell: bash
      - name: Upload APK attestations to Release
        if: steps.release_step.outputs.new_release_published == 'true'
        uses: ./.github/actions/upload-release-attestations
        with:
          release-tag: ${{ steps.release_step.outputs.new_release_git_tag }}
          release-bundle: ${{ steps.attest-release.outputs.bundle-path }}
          debug-bundle: ${{ steps.attest-debug.outputs.bundle-path }}
