name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Missing secret KEYSTORE"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Missing secret KEYSTORE"
            exit 1
          fi

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode\s*=\s*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not extract versionName or versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build with Gradle
        shell: bash
        run: |
          printf '%s\n' \
            "storeFile=../keystore.jks" \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" \
            "keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" \
            > signing.properties
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks
          VERSION="${{ steps.version.outputs.version_name }}"
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Hail-v${VERSION}.apk
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            ./gradlew assembleRelease -Pabi=$abi --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Hail-v${VERSION}-${abi}.apk
          done
          ls -la app/build/outputs/apk/release/

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "No changelog found." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          {
            echo "body<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          overwrite: true
          files: |
            app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}.apk
            app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}-arm64-v8a.apk
            app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}-armeabi-v7a.apk
            app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}-x86.apk
            app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}-x86_64.apk
