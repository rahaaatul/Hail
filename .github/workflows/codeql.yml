name: CodeQL

on:
  push:
    branches:
      - main
      - dev
    # Only scan when something the analysis depends on changed. The filter is
    # deliberately not global: the scheduled scan and the merge queue check
    # must run unconditionally, otherwise a documentation-only commit would
    # suppress the weekly scan.
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-java-gradle/**'
      - '.github/actions/build-apk/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-java-gradle/**'
      - '.github/actions/build-apk/**'
  merge_group:
    # Required once a merge queue is enabled, otherwise the required check is
    # never reported for a merge group and the merge cannot complete.
    types: [checks_requested]
  schedule:
    - cron: '28 9 * * 0'  # Every Sunday at 9:28 AM UTC

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Grant the minimum required permissions for CodeQL analysis
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: java-kotlin
          # The default suite is the most precise one and returns few results.
          # The security-extended suite adds the lower precision and lower
          # severity queries on top of it, which is worth the extra noise for
          # a project this small.
          queries: security-extended

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          # CodeQL must observe the Kotlin/Java compiler actually running: task
          # outputs restored FROM-CACHE produce no TRAP files, so the database
          # comes out empty or partial. Keep the dependency cache, drop the
          # build cache.
          gradle-build-cache: 'false'
          # This job builds and analyses code from an untrusted pull request,
          # so the token must not be left in the local git configuration.
          persist-credentials: 'false'

      - name: Code check (Detekt, Spotless, Kover)
        uses: ./.github/actions/code-check
        with:
          # CodeQL must observe the compiler actually running, so nothing in
          # this job may be restored from the build cache.
          gradle-args: '--no-build-cache'

      - name: Build APKs for CodeQL analysis
        uses: ./.github/actions/build-apk
        with:
          gradle-args: '--no-build-cache'
          variants: 'assembleRelease'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:java-kotlin"
