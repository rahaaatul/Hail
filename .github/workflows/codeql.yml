name: CodeQL

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '28 9 * * 0'  # Every Sunday at 9:28 AM UTC

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      # Grant the minimum required permissions for CodeQL analysis
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3db7caf9014b962f9392088c0fcaf53eeddf47db
        with:
          languages: java-kotlin

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          # CodeQL must observe the Kotlin/Java compiler actually running: task
          # outputs restored FROM-CACHE produce no TRAP files, so the database
          # comes out empty or partial. Keep the dependency cache, drop the
          # build cache.
          gradle-build-cache: 'false'

      - name: Build APKs for CodeQL analysis
        uses: ./.github/actions/build-apk
        with:
          gradle-args: '--no-build-cache'
          # Unit tests and Detekt contribute no CodeQL findings: the test
          # execution runs no compiler, and Detekt only parses sources. The
          # release variant is compiled and traced, which is what the
          # database needs.
          run-tests: 'false'
          run-detekt: 'false'
          variants: 'assembleRelease'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3db7caf9014b962f9392088c0fcaf53eeddf47db
        with:
          category: "/language:java-kotlin"
