name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - pre-release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
      build_type: ${{ steps.build_type.outputs.build_type }}
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: fastlane

      - name: Setup toolchain
        run: bash .github/scripts/setup.sh

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "==> Version: $VERSION_NAME"

      - name: Resolve build type
        id: build_type
        run: echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT

      - name: Validate signing secrets
        if: ${{ steps.build_type.outputs.build_type != 'debug' }}
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Missing secret KEYSTORE"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS_PASSWORD"
            exit 1
          fi
          echo "==> Signing secrets present"

      - name: Build debug APK
        if: ${{ steps.build_type.outputs.build_type == 'debug' }}
        id: build_debug
        env:
          RUNNER_DEBUG: 1
        run: |
          bundle exec fastlane build_debug
          apk_path=$(find app/build/outputs/apk -maxdepth 2 -type f \( -name 'Hail-*-pr.apk' -o -name 'Hail-*-debug.apk' \) | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "==> Built: $apk_path"

      - name: Build release APK
        if: ${{ steps.build_type.outputs.build_type != 'debug' }}
        id: build_release
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          RELEASE_TYPE: ${{ steps.build_type.outputs.build_type }}
        run: |
          bundle exec fastlane build_release release_type:${{ steps.build_type.outputs.build_type }}
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'Hail-v*-*' | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No release APK found after build"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "==> Built: $apk_path"

      - name: Compress APK
        id: zip
        if: ${{ steps.build_type.outputs.build_type == 'debug' }}
        env:
          RUNNER_DEBUG: 1
        run: |
          set -x
          bash .github/scripts/zip.sh "${{ steps.build_debug.outputs.apk_path }}"
          zip_path=$(find app/build/outputs/apk -maxdepth 2 -type f \( -name '*.7z' -o -name '*.zip' \) | head -1)
          if [[ -z "$zip_path" ]]; then
            echo "::error::No compressed APK found after zip"
            exit 1
          fi
          echo "zip_path=$zip_path" >> $GITHUB_OUTPUT
          echo "==> Compressed: $zip_path"

      - name: Upload Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ steps.zip.outputs.zip_path }}" ]]; then
            ARTIFACT="${{ steps.zip.outputs.zip_path }}"
          else
            ARTIFACT="${{ steps.build_debug.outputs.apk_path || steps.build_release.outputs.apk_path }}"
          fi
          TG_BODY="$(bash .github/scripts/tg_body.sh)"
          echo "${TG_BODY}" > telegram_caption.html
          bundle exec fastlane telegram_notify \
            artifact:"${ARTIFACT}" \
            build_type:"${{ steps.build_type.outputs.build_type }}" \
            pr_number:"${{ github.event.number }}" \
            caption_file:"telegram_caption.html"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ steps.zip.outputs.zip_path != '' && steps.zip.outputs.zip_path || steps.build_debug.outputs.apk_path || steps.build_release.outputs.apk_path }}
          retention-days: 7

  create-release:
    if: ${{ needs.build.outputs.build_type != 'debug' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: fastlane

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Read changelog
        id: changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "No changelog found." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION="${{ needs.build.outputs.version_name }}"
          {
            echo "body<<EOF"
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Flatten release APK
        id: flatten
        shell: bash
        run: |
          apk_path=$(find artifacts -type f -name '*.apk' | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No APK found in downloaded artifacts"
            exit 1
          fi
          flat="Hail-v${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.build_type }}.apk"
          cp "$apk_path" "$flat"
          echo "apk_path=$flat" >> $GITHUB_OUTPUT
          echo "==> Flattened: $apk_path -> $flat"

      - name: Create GitHub Release
        run: |
          bundle exec fastlane github_release \
            tag:"${{ needs.build.outputs.tag }}" \
            repository:"${{ github.repository }}" \
            api_token:"${{ secrets.GH_TOKEN }}" \
            name:"${{ needs.build.outputs.version_name }}" \
            description_file:"${{ github.workspace }}/CHANGELOG.md" \
            asset_path:"${{ steps.flatten.outputs.apk_path }}" \
            prerelease:"${{ needs.build.outputs.build_type == 'pre-release' }}"
