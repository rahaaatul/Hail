name: Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - pre-release

# Deny by default: no GITHUB_TOKEN scopes are granted at the workflow level.
# Each job opts in to exactly the scopes it needs (see below), so adding a new
# job cannot silently inherit write access.
permissions: {}

# One run per ref at a time. A release run must never be cancelled halfway:
# cancel-in-progress: true can kill the run while softprops/action-gh-release
# is uploading, leaving a published release with a truncated or replaced asset.
# That is the only thing cancel-in-progress: false buys us, and it is why the
# setting is false. It does NOT mean queued runs wait their turn.
#
# A concurrency group holds at most one in-progress run and at most one
# PENDING run. Dispatching three release runs in quick succession therefore
# gives: run 1 in progress, run 2 pending, run 3 dispatched -- and the arrival
# of run 3 CANCELS run 2 outright, before its build job ever reaches
# create-release. So a middle run can be dropped whole, no release is ever
# guaranteed to be published, and the outcome is last-dispatch-wins rather than
# FIFO: never assume runs are released in the order they were dispatched, and
# never assume that dispatching a build means that version gets released.
#
# Grouping by ref is still enough to serialise release builds, because every
# release run is dispatched on the same ref, and create-release only runs for
# refs/heads/main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # This job is triggered by pull_request and executes PR-supplied Gradle
    # build scripts (app/build.gradle.kts, settings.gradle.kts, included
    # builds), i.e. arbitrary code from external contributors. It therefore
    # gets no writable scope. It needs two read-only scopes: contents: read to
    # check out the repo, and pull-requests: read because tg_body.sh fetches
    # GET /repos/{repo}/pulls/{number} for the PR title used as the Telegram
    # caption. Without the latter the lookup 403s and the caption silently
    # falls back to the local commit subject.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
      build_type: ${{ steps.build_type.outputs.build_type }}
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Do not leave the token in .git/config (http.<url>.extraheader) for
          # the Gradle build steps that follow, which run PR-supplied code.
          persist-credentials: false

      - name: Setup toolchain
        run: bash .github/scripts/setup.sh

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "==> Version: $VERSION_NAME"

      - name: Resolve build type
        id: build_type
        run: echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT

      - name: Validate signing secrets
        if: ${{ steps.build_type.outputs.build_type != 'debug' }}
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Missing secret KEYSTORE"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS_PASSWORD"
            exit 1
          fi
          echo "==> Signing secrets present"

      - name: Build debug APK
        if: ${{ steps.build_type.outputs.build_type == 'debug' }}
        id: build_debug
        env:
          PR_NUMBER: ${{ github.event.number }}
          RUNNER_DEBUG: 1
        run: |
          set -x
          if [[ -n "${PR_NUMBER:-}" ]]; then
            bash .github/scripts/pr.sh
          else
            bash .github/scripts/debug.sh
          fi
          apk_path=$(find app/build/outputs/apk -maxdepth 2 -type f \( -name 'Hail-*-pr.apk' -o -name 'Hail-*-debug.apk' \) | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No APK found after build"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "==> Built: $apk_path"

      - name: Build release APK
        if: ${{ steps.build_type.outputs.build_type != 'debug' }}
        id: build_release
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
          RELEASE_TYPE: ${{ steps.build_type.outputs.build_type }}
        run: |
          bash .github/scripts/release.sh
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'Hail-v*-*' | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No release APK found after build"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "==> Built: $apk_path"

      - name: Compress APK
        id: zip
        if: ${{ steps.build_type.outputs.build_type == 'debug' }}
        env:
          RUNNER_DEBUG: 1
        run: |
          set -x
          bash .github/scripts/zip.sh "${{ steps.build_debug.outputs.apk_path }}"
          zip_path=$(find app/build/outputs/apk -maxdepth 2 -type f \( -name '*.7z' -o -name '*.zip' \) | head -1)
          if [[ -z "$zip_path" ]]; then
            echo "::error::No compressed APK found after zip"
            exit 1
          fi
          echo "zip_path=$zip_path" >> $GITHUB_OUTPUT
          echo "==> Compressed: $zip_path"

      - name: Upload Telegram
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.number }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_GROUP: ${{ secrets.TG_GROUP }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ steps.zip.outputs.zip_path }}" ]]; then
            bash .github/scripts/upload.sh ${{ steps.zip.outputs.zip_path }}
          else
            bash .github/scripts/upload.sh ${{ steps.build_debug.outputs.apk_path || steps.build_release.outputs.apk_path }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ steps.zip.outputs.zip_path != '' && steps.zip.outputs.zip_path || steps.build_debug.outputs.apk_path || steps.build_release.outputs.apk_path }}
          retention-days: 7

  create-release:
    # workflow_dispatch can target any branch, and tag_name comes solely from
    # versionName in app/build.gradle.kts, so a run dispatched from some other
    # branch (or from a tag) would create or re-point the release tag and
    # replace an already-published signed APK. Publish from main only.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.build.outputs.build_type != 'debug'
    needs: [build]
    runs-on: ubuntu-latest
    # The only job that writes to the repository: softprops/action-gh-release
    # creates the GitHub Release and uploads its assets via the REST API, which
    # requires contents: write. Nothing else in this workflow mutates the repo.
    # It never reads pull-request data, so it gets no pull-requests scope.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The release action authenticates with the ambient GITHUB_TOKEN
          # (its `token` input), not with git push credentials, so the token
          # does not need to be persisted into .git/config.
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Read changelog
        id: changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "No changelog found." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION="${{ needs.build.outputs.version_name }}"
          {
            echo "body<<EOF"
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Flatten release APK
        id: flatten
        shell: bash
        run: |
          apk_path=$(find artifacts -type f -name '*.apk' | head -1)
          if [[ -z "$apk_path" ]]; then
            echo "::error::No APK found in downloaded artifacts"
            exit 1
          fi
          flat="Hail-v${{ needs.build.outputs.version_name }}-${{ needs.build.outputs.build_type }}.apk"
          cp "$apk_path" "$flat"
          echo "apk_path=$flat" >> $GITHUB_OUTPUT
          echo "==> Flattened: $apk_path -> $flat"

      - name: Pre-flight release check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          : "${RUNNER_TEMP:?RUNNER_TEMP is unset; GitHub Actions always sets it}"
          : "${GITHUB_SHA:?GITHUB_SHA is unset; the provenance check below needs it}"
          : "${GITHUB_REF_NAME:?GITHUB_REF_NAME is unset; the provenance check below needs it}"

          # Scratch space for the single API call below.
          #
          # RUNNER_TEMP is the runner's own per-job directory: GitHub guarantees
          # it exists, it sits outside the checked-out source tree, and it is
          # wiped between jobs. A hardcoded /tmp would be shared by concurrent
          # jobs on a self-hosted runner, so two runs of the same tag could
          # interleave writes on one response file; and writing scratch files
          # into the checkout risks a later upload or git status picking them
          # up. Hence RUNNER_TEMP rather than /tmp.
          # RAW is what `gh api --include` writes: status line, response
          # headers, blank line, body. RESP is the body on its own, because
          # that is what the jq reads further down parse.
          RAW="${RUNNER_TEMP}/preflight-release.raw"
          RESP="${RUNNER_TEMP}/preflight-release.json"
          ERR="${RUNNER_TEMP}/preflight-release.err"

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is not on PATH, so the existing release cannot be read. Refusing to continue: a pre-flight that cannot read the release is indistinguishable from one that found none."
            exit 1
          fi

          # RECOVERY PROCEDURE (deliberate operational step, see issue #89).
          # The Create GitHub Release step below runs WITHOUT overwrite_files,
          # so if a release for $TAG already carries an asset, the upload fails
          # with an opaque "422 Validation Failed / already_exists" and the run
          # cannot be retried. That protection is intended, but it also strands
          # the release left behind when a run dies mid-upload (runner
          # eviction, network, or the pending-run cancellation that the
          # concurrency group above can perform).
          #
          # A release that carries an asset is also the state a SUCCESSFUL
          # release leaves, so the most common trigger here is an ordinary
          # re-dispatch that forgot to bump versionName, not a partial
          # release. The message below therefore reports the release's own
          # draft/published_at state and lets the operator decide, rather than
          # telling them to trash something that may be a legitimate release.
          #
          # This step does not overwrite anything. It only converts the
          # unreachable-in-advance 422 into a failure that names the choice.

          # HOW "ABSENT" IS ESTABLISHED -- AND WHY IT IS NOT A TEXT MATCH
          #
          # `gh api` exits non-zero for EVERY non-2xx, so the exit status
          # alone cannot distinguish "no such release" (404) from "could not
          # find out" (401 expired token, 403 under-scoped token or rate
          # limit, 5xx, DNS failure on the runner).
          #
          # The previous version of this step put `2>/dev/null` inside the
          # if-condition and branched on the exit status. Every one of those
          # failures therefore read as "no release exists": the step printed
          # "No existing assets", asserting something it had never checked,
          # and the run continued to the upload that fails with an opaque 422
          # already_exists. The guard switched itself off exactly when it was
          # needed.
          #
          # The version after that captured stderr and grepped it for the
          # substring "HTTP 404". That is server-controlled prose, not a
          # status. gh builds its own stderr line as
          #     gh: <message> (HTTP <status>)
          # and <message> is the response body's "message" field, so a 403
          # whose body is {"message":"HTTP 404"} yields
          #     gh: HTTP 404 (HTTP 403)
          # which that grep read as "no such release". Observed against
          # gh 2.101.0; the commit message records the reproduction.
          #
          # The status is therefore read from the HTTP response STATUS LINE,
          # which this call now requests with --include. net/http writes that
          # line from the status it received on the wire, and no response body
          # can influence it, so a server can no longer talk this check into
          # passing. Two conditions must both hold:
          #   * line 1 is "HTTP/<version> 404 <reason>"
          #   * the body after the header block parses as a JSON object
          # The second is what makes it a *genuine* 404 rather than a 404 from
          # a proxy or CDN in front of api.github.com: that arrives as an HTML
          # error page, which means "could not find out" and fails closed too.
          #
          # DOCUMENTED TRADE-OFF: if `gh api` ever changes the --include
          # framing, or stops printing the status line for a non-2xx, then a
          # legitimate "no release yet" run fails closed and no release can be
          # published until this is updated. That is the right way round for
          # this guard -- a blocked release is visible and recoverable, while
          # an accepted 403 silently disables the guard and lets a run
          # overwrite a published release -- but it should not be something the
          # next person discovers on a release day.
          #
          # Only a genuine 404 is evidence of absence. Every other outcome
          # stops the run, with the status line and the API's own message
          # attached.
          if gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "${RAW}" 2> "${ERR}"; then
            # 2xx. --include prefixes the body with the status line, the
            # response headers and a blank line, so drop everything up to and
            # including that blank line. The separator is a bare CR rather
            # than an empty line, hence the \r in the range.
            sed '1,/^\r\{0,1\}$/d' "${RAW}" > "${RESP}"
          else
            # Non-2xx. The status comes from line 1 of the response and only
            # from line 1, so a later line of server text cannot stand in for
            # it however it is worded.
            HTTP_STATUS="$(sed -n '1s|^HTTP/[0-9][0-9.]* \([0-9][0-9][0-9]\) .\{1,\}$|\1|p' "${RAW}")"
            if [ "${HTTP_STATUS}" = "404" ] && sed '1,/^\r\{0,1\}$/d' "${RAW}" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "==> ${TAG}: the API reports no release with this tag (HTTP 404), so create-release will create it"
              exit 0
            fi
            echo "::error::Could not determine whether release ${TAG} already exists, so this pre-flight cannot vouch for it."
            echo "::error::Only a genuine HTTP 404 from api.github.com proves absence. Any other failure (401/403 token scope or rate limit, 5xx, DNS, or a 404 from a proxy rather than from the API) leaves the state of ${TAG} UNKNOWN, and reading that as 'absent' disables this guard and lets the run reach the upload that fails with an opaque 422 already_exists."
            echo "::error::Response status line: $(head -n 1 "${RAW}")"
            sed 's/^/::error::/' "${ERR}" >&2
            exit 1
          fi

          # One response, four facts. The release object is fetched once --
          # header block stripped, so RESP holds just its body -- and every
          # field either branch below needs is read out of that single file,
          # rather than paying for a second API call per field.
          ASSETS="$(jq -r '(.assets // [])[].name' "${RESP}" | tr '\n' ' ')"
          ASSETS="${ASSETS% }"
          DRAFT="$(jq -r '.draft // false' "${RESP}")"
          PUBLISHED_AT="$(jq -r '.published_at // "null"' "${RESP}")"
          TARGET="$(jq -r '.target_commitish // ""' "${RESP}")"

          # PROVENANCE: does this release point at the commit this run built?
          #
          # target_commitish is whatever the creating request passed, and the
          # REST API defaults it to the release's branch, so in this repo it
          # holds a branch name ("main", and "master" on the older releases),
          # never a commit id. Comparing it to GITHUB_SHA directly would
          # therefore report a mismatch on every run, including correct ones,
          # and prove nothing. So compare each shape against the value it can
          # actually be compared to:
          #   * 40 hex        -> a commit id:    compare with GITHUB_SHA
          #   * anything else -> a branch name:  compare with GITHUB_REF_NAME
          if printf '%s' "${TARGET}" | grep -Eq '^[0-9a-f]{40}$'; then
            if [ "${TARGET}" != "${GITHUB_SHA}" ]; then
              echo "::error::Release ${TAG} records target_commitish ${TARGET}, but this run built ${GITHUB_SHA}."
              echo "::error::Attaching a freshly built APK to a tag that points at a different commit publishes an asset that does not match its tag. Bump versionName in app/build.gradle.kts, or delete the release at ${RELEASE_URL} and its git tag, then re-dispatch."
              exit 1
            fi
            echo "==> ${TAG}: target_commitish ${TARGET} is the commit this run built"
          elif [ "${TARGET}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Release ${TAG} records target_commitish '${TARGET}', which is neither a commit id nor this run's ref ('${GITHUB_REF_NAME}'), so its provenance cannot be reconciled with the ${GITHUB_SHA} this run built."
            echo "::error::Bump versionName in app/build.gradle.kts, or delete the release at ${RELEASE_URL} and its git tag, then re-dispatch."
            exit 1
          else
            echo "==> ${TAG}: target_commitish is the branch '${TARGET}', not a commit id, so it cannot be compared with ${GITHUB_SHA}; it does match this run's ref."
          fi

          # Branch 1: the tag already carries an asset, so the upload below
          # cannot succeed. This is the state a SUCCESSFUL release leaves, so
          # the ordinary trigger is a re-dispatch that forgot to bump
          # versionName. The previous message called it a "partial release"
          # and told the operator to delete it, which for that common case
          # means trashing a legitimate, published release.
          if [ -n "${ASSETS}" ]; then
            echo "::error::Release ${TAG} already exists and already carries asset(s): ${ASSETS}"
            echo "::error::The Create GitHub Release step does not overwrite assets, so re-dispatching fails with \"422 Validation Failed / already_exists\" instead of replacing them."
            if [ "${DRAFT}" = "true" ] || [ "${PUBLISHED_AT}" = "null" ]; then
              echo "::error::This release was never published (draft=${DRAFT}, published_at=${PUBLISHED_AT})."
            else
              echo "::error::This release is published (draft=${DRAFT}, published_at=${PUBLISHED_AT}), so treat it as legitimate unless you know otherwise: the usual trigger is re-dispatching without bumping versionName."
            fi
            echo "::error::Pick the recovery that matches what this release actually is:"
            echo "::error::  1. Preferred: bump versionName in app/build.gradle.kts, commit, and re-dispatch. Every run publishes its own tag, so nothing already published is touched."
            echo "::error::  2. Only if this release is genuinely wrong: open ${RELEASE_URL}, \"Trash release\", and then check the repository's Tags list for ${TAG} -- deleting the release does not reliably delete the tag it points at, and a tag that survives is reused by the next dispatch. Then re-dispatch."
            exit 1
          fi

          # Branch 2: the release exists but carries no asset. That is
          # identified from the release's own draft/published_at state above,
          # not inferred from the zero asset count. softprops/action-gh-release
          # creates releases published rather than as drafts, so draft=false
          # here is the expected shape and means the earlier run died between
          # creating the release and finishing the upload.
          echo "==> ${TAG}: release exists with no asset (draft=${DRAFT}, published_at=${PUBLISHED_AT}) -- an earlier run most likely died mid-upload"
          echo "==> ${TAG}: proceeding completes that existing release with the APK from this run; check the uploaded asset on ${RELEASE_URL} afterwards"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: v${{ needs.build.outputs.version_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ needs.build.outputs.build_type == 'pre-release' }}
          # Never overwrite an asset on an existing release: republishing a
          # tag must not silently replace a signed APK users already have.
          # softprops/action-gh-release defaults overwrite_files to false, so
          # that protection survives; the Pre-flight release check above turns
          # the resulting 422 already_exists into an actionable message.
          #
          # fail_on_unmatched_files is deliberately absent: it guards the
          # glob-mismatch path, but files: below is the literal path emitted by
          # the Flatten release APK step, not a glob, and that step already
          # fails the job when find returns nothing. The input cannot fire.
          files: ${{ steps.flatten.outputs.apk_path }}