name: Dev Release

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

jobs:
  metadata:
    name: Read metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-metadata.outputs.version }}
      appName: ${{ steps.read-metadata.outputs.appName }}
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: read-metadata

  build-release-apk:
    name: Build release APK
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      apkPath: ${{ steps.rename-apk.outputs.renamedApkPath }}
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        id: build-apk
        with:
          buildType: 'release'
      - name: Rename APK
        uses: .github/actions/rename-apk
        id: rename-apk
        with:
          apkPath: ${{ steps.build-apk.outputs.apkPath }}
          version: ${{ needs.metadata.outputs.version }}
          appName: ${{ needs.metadata.outputs.appName }}

  build-debug-apk:
    name: Build debug APK
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      apkPath: ${{ steps.rename-apk.outputs.renamedApkPath }}
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        id: build-apk
        with:
          buildType: 'debug'
      - name: Rename APK
        uses: .github/actions/rename-apk
        id: rename-apk
        with:
          apkPath: ${{ steps.build-apk.outputs.apkPath }}
          version: ${{ needs.metadata.outputs.version }}
          appName: ${{ needs.metadata.outputs.appName }}

  release-and-upload:
    name: Release and upload APKs
    needs: [metadata, build-release-apk, build-debug-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Release (semantic-release)
        uses: cycjimmy/semantic-release-action@v6
        id: release_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ needs.build-release-apk.outputs.apkPath }}
          asset_name: ${{ needs.build-release-apk.outputs.apkPath }}
          asset_content_type: application/vnd.android.package-archive
      - name: Upload Debug APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.release_step.outputs.upload_url }}
          asset_path: ${{ needs.build-debug-apk.outputs.apkPath }}
          asset_name: ${{ needs.build-debug-apk.outputs.apkPath }}
          asset_content_type: application/vnd.android.package-archive