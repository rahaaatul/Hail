name: Open a PR to main

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      releaseApkPath: ${{ steps.build.outputs.releaseApkPath }}
      debugApkPath: ${{ steps.build.outputs.debugApkPath }}
    steps:
       - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
         with:
           fetch-depth: 0
       - name: Setup Java and Gradle
         uses: ./.github/actions/setup-java-gradle
         with:
           java-version: '21'
           distribution: 'temurin'
           gradle-cache: 'true'
       - name: Build APKs (with metadata, tests, and Detekt)
         id: build
         uses: ./.github/actions/build-apk
       - name: Upload release APK as artifact
         uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
         with:
           name: open-pr-release-apk-${{ github.sha }}
           path: ${{ steps.build.outputs.releaseApkPath }}
           retention-days: 7
           archive: false
       - name: Upload debug APK as artifact
         uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
         with:
           name: open-pr-debug-apk-${{ github.sha }}
           path: ${{ steps.build.outputs.debugApkPath }}
           retention-days: 7
           archive: false

  pull-request:
    name: Open pull request
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Open pull request
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5
        with:
          destination_branch: main
          pr_title: 'chore: ${{ env.MESSAGE }}'
          pr_body: |
            This pull request will ${{ env.MESSAGE }}.

            ## Before merging this PR

            - [ ] Verify the build passes
          pr_draft: true
