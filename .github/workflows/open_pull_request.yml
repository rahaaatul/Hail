name: Open a PR to main

on:
  push:
    branches:
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/jni/**'
      - 'app/src/main/aidl/**'
      - 'app/src/main/rs/**'
      - '.editorconfig'
      - 'config/detekt.yml'
      - 'config/detekt-baseline.xml'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      releaseApkPath: ${{ steps.build.outputs.releaseApkPath }}
      debugApkPath: ${{ steps.build.outputs.debugApkPath }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Code check (Detekt, Spotless, Kover)
        uses: ./.github/actions/code-check
      - name: Build APKs
        id: build
        uses: ./.github/actions/build-apk
      - name: Upload release APK as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: open-pr-release-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.releaseApkPath }}
          retention-days: 7
      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: open-pr-debug-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.debugApkPath }}
          retention-days: 7

  pull-request:
    name: Open pull request
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check for commits to merge
        id: changes
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          COUNT=$(git rev-list --count origin/main..HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No commits ahead of main, nothing to merge."
          else
            echo "$COUNT commit(s) ahead of main."
          fi
        shell: bash
      - name: Open pull request
        if: steps.changes.outputs.count != '0'
        uses: repo-sync/pull-request@7e79a9f5dc3ad0ce53138f01df2fad14a04831c5
        with:
          destination_branch: main
          pr_title: 'chore: ${{ env.MESSAGE }}'
          pr_body: |
            This pull request will ${{ env.MESSAGE }}.

            ## Before merging this PR

            - [ ] Verify the build passes
          pr_draft: true
