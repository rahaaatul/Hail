name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/r8-rules.pro'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/jni/**'
      - 'app/src/main/aidl/**'
      - 'app/src/main/rs/**'
      - '.editorconfig'
      - 'config/detekt.yml'
      - 'config/detekt-baseline.xml'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app/r8-rules.pro'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/jni/**'
      - 'app/src/main/aidl/**'
      - 'app/src/main/rs/**'
      - '.editorconfig'
      - 'config/detekt.yml'
      - 'config/detekt-baseline.xml'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Lint the workflow files
        uses: ./.github/actions/lint-workflows
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Code check (Detekt, Spotless, Kover)
        uses: ./.github/actions/code-check
      - name: Build both APKs
        uses: ./.github/actions/build-apk
        id: build
      - name: Upload release APK as artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.releaseApkPath }}
          retention-days: 30
      - name: Upload debug APK as artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debug-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.debugApkPath }}
          retention-days: 30
