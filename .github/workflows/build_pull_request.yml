name: Build pull request

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Short description of what this PR will do'
        required: false
        default: 'update the development branch'
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MESSAGE: ${{ github.event.inputs.message || 'update the development branch' }}

jobs:
  build:
    name: Build APK
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: ./.github/actions/commitlint
        with:
          config-file: './commitlint.config.js'
      - name: Check for changed workflow files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COUNT=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | wc -l)
          else
            COUNT=$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | wc -l)
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Lint the workflow files
        if: steps.changed-files.outputs.count != '0'
        uses: ./.github/actions/lint-workflows
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
          keystore-file: '${{ secrets.KEYSTORE }}'
          keystore-password: '${{ secrets.KEYSTORE_PASSWORD }}'
          key-alias: '${{ secrets.KEYSTORE_ALIAS }}'
          key-password: '${{ secrets.KEYSTORE_ALIAS_PASSWORD }}'
      - name: Code check (Detekt, Spotless, Kover)
        uses: ./.github/actions/code-check
      - name: Build both APKs
        uses: ./.github/actions/build-apk
        id: build
      - name: Upload release APK as artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.releaseApkPath }}
          retention-days: 1
      - name: Upload debug APK as artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debug-apk-${{ github.sha }}
          path: ${{ steps.build.outputs.debugApkPath }}
          retention-days: 1
