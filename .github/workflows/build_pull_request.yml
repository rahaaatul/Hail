name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'gradle/**'
      - '**.kt'
      - '**.java'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'res/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'src/main/assets/**'
      - 'src/main/jni/**'
      - 'src/main/aidl/**'
      - 'src/main/rs/**'
      - '!**.md'
      - '!**.txt'
      - '!LICENSE'
      - '!README.md'
   pull_request:
     branches:
       - dev
       - main
     paths:
       - 'src/**'
       - 'gradle/**'
       - '**.kt'
       - '**.java'
       - 'build.gradle.kts'
       - 'settings.gradle.kts'
       - 'gradle.properties'
       - 'AndroidManifest.xml'
       - 'res/**'
       - '.github/workflows/**'
       - '.github/actions/**'
       - 'src/main/assets/**'
       - 'src/main/jni/**'
       - 'src/main/aidl/**'
       - 'src/main/rs/**'
       - '!**.md'
       - '!'.txt'
       - '!LICENSE'
       - '!README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildType: [release, debug]
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        id: build
        with:
          buildType: ${{ matrix.buildType }}
      - name: Rename APK
        uses: .github/actions/rename-apk
        id: rename
        with:
          apkPath: ${{ steps.build.outputs.apkPath }}
          version: ${{ steps.metadata.outputs.version }}
          appName: ${{ steps.metadata.outputs.appName }}