name: Build pull request

on:
  workflow_dispatch:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        buildType: [release, debug]
    steps:
      - name: Setup Java and Gradle
        uses: .github/actions/setup-java-gradle
        with:
          java-version: '21'
          distribution: 'temurin'
          gradle-cache: 'true'
      - name: Read metadata
        uses: .github/actions/read-metadata
        id: metadata
      - name: Build APK
        uses: .github/actions/build-apk
        with:
          buildType: ${{ matrix.buildType }}
      - name: Rename APK
        uses: .github/actions/rename-apk
        with:
          buildType: ${{ matrix.buildType }}
          version: ${{ steps.metadata.outputs.version }}
          appName: ${{ steps.metadata.outputs.appName }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.buildType }}-apk
          path: app/build/outputs/apk/${{ matrix.buildType }}/${{ steps.metadata.outputs.appName }}-${{ steps.metadata.outputs.version }}-${{ matrix.buildType }}.apk
