name: 'Build and Upload APK'
description: 'Run unit tests, build, rename, and upload an APK for the specified build type'
inputs:
  buildType:
    description: 'Type of build (release or debug)'
    required: true
  version:
    description: 'Version of the app'
    required: true
  appName:
    description: 'Name of the app'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set up script permissions
      run: chmod +x build-and-rename-and-test.sh
    - name: Build, rename, and test APK
      run: ./build-and-rename-and-test.sh
      env:
        BUILD_TYPE: ${{ inputs.buildType }}
        VERSION: ${{ inputs.version }}
        APP_NAME: ${{ inputs.appName }}
    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.buildType }}-apk
        path: app/build/outputs/apk/${{ inputs.buildType }}/${{ inputs.appName }}-${{ inputs.version }}-${{ inputs.buildType }}.apk
