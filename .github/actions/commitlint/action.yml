name: Lint Commit Messages
description: Lint commit messages using Commitlint to enforce Conventional Commits standard
inputs:
  config-file:
    description: Path to commitlint config file
    required: false
    default: './commitlint.config.js'
  fail-on-warning:
    description: Whether to fail on warnings
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Checkout code (if not already done)
      if: ${{ env.ACTIONS_CHECKOUT_DONE != 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup Node.js for commitlint
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 'lts/*'
        cache: 'npm'
    - name: Install commitlint dependencies
      run: |
        set -euo pipefail
        npm install @commitlint/cli @commitlint/config-conventional --save-dev
      shell: bash
    - name: Lint commit messages
      run: |
        set -euo pipefail
        BEFORE="${{ github.event.before || github.event.pull_request.base.sha || github.event.after }}"
        if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          npx commitlint --from="$(git merge-base HEAD "$BEFORE")" --to=HEAD --verbose --config "$CONFIG_FILE"
        elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
          npx commitlint --from=HEAD^ --to=HEAD --verbose --config "$CONFIG_FILE"
        else
          npx commitlint --last --verbose --config "$CONFIG_FILE"
        fi
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
