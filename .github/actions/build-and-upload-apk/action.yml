name: 'Build and Upload APK'
description: 'Build, rename, and upload an APK for the specified build type'
inputs:
  buildType:
    description: 'Type of build (release or debug)'
    required: true
  version:
    description: 'Version of the app'
    required: true
  appName:
    description: 'Name of the app'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Build APK
      run: ./gradlew assemble${{ inputs.buildType }}
      shell: bash
    - name: Rename APK
      run: |
        APK_DIR=app/build/outputs/apk/${{ inputs.buildType }}
        APK_NAME=$(ls $APK_DIR/*.apk)
        NEW_NAME="${{ inputs.appName }}-${{ inputs.version }}-${{ inputs.buildType }}.apk"
        mv "$APK_NAME" "$APK_DIR/$NEW_NAME"
      shell: bash
    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.buildType }}-apk
        path: app/build/outputs/apk/${{ inputs.buildType }}/${{ inputs.appName }}-${{ inputs.version }}-${{ inputs.buildType }}.apk
