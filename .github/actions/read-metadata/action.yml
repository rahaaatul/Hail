name: 'Read Metadata'
description: 'Read version and appName from gradle.properties'
runs:
  using: 'composite'
  steps:
    - name: Read version and appName
      run: |
        VERSION=$(grep '^version =' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        APP_NAME=$(grep '^appName =' gradle.properties | cut -d'=' -f2 | tr -d ' ')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "appName=$APP_NAME" >> $GITHUB_OUTPUT
      shell: bash
