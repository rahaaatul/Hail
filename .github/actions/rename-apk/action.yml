name: 'Rename APK'
description: 'Rename the APK to include version and app name'
inputs:
  apkPath:
    description: 'Path to the APK to rename'
    required: true
  version:
    description: 'Version of the app'
    required: true
  appName:
    description: 'Application name'
    required: true
outputs:
  renamedApkPath:
    description: 'Path to the renamed APK'
runs:
  using: 'composite'
  steps:
    - name: Rename APK
      id: rename
      run: |
        # Extract directory and filename
        DIR=$(dirname "${{ inputs.apkPath }}")
        FILENAME=$(basename "${{ inputs.apkPath }}")
        # Remove extension
        BASENAME="${FILENAME%.*}"
        EXT="${FILENAME##*.}"
        # Construct new filename
        NEW_FILENAME="${{ inputs.appName }}-${{ inputs.version }}-${BASENAME}.${EXT}"
        NEW_PATH="$DIR/$NEW_FILENAME"
        # Rename
        mv "${{ inputs.apkPath }}" "$NEW_PATH"
        echo "renamedApkPath=$NEW_PATH" >> $GITHUB_OUTPUT
      shell: bash