name: 'Build APK'
description: 'Build the APK for the specified build type'
inputs:
  buildType:
    description: 'Type of build (release or debug)'
    required: false
    default: 'release'
runs:
  using: 'composite'
  steps:
    - name: Build APK
      run: ./gradlew assemble${{ inputs.buildType }}
      shell: bash
