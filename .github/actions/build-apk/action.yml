name: Build APK
description: Build both release and debug APKs with unit testing and code quality checks
inputs:
outputs:
  releaseApkPath:
    description: Path to the built release APK
  debugApkPath:
    description: Path to the built debug APK
runs:
  using: composite
  steps:
    - name: Run unit tests
      run: ./gradlew test --no-daemon
      shell: bash
    - name: Run Detekt code quality checks
      run: ./gradlew detekt --no-daemon
      shell: bash
    - name: Assemble release APK
      run: ./gradlew assembleRelease --no-daemon
      shell: bash
    - name: Assemble debug APK
      run: ./gradlew assembleDebug --no-daemon
      shell: bash
    - name: Find release APK
      id: find_release
      run: |
        APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "releaseApkPath=$APK" >> $GITHUB_OUTPUT
      shell: bash
    - name: Find debug APK
      id: find_debug
      run: |
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
        echo "debugApkPath=$APK" >> $GITHUB_OUTPUT
      shell: bash